# Grafana Datasource Configuration
# =================================
# Automatically configures Prometheus as a datasource in Grafana.
#
# Place this in the Grafana provisioning directory:
#   monitoring/grafana/datasources/datasource.yml
#
# Grafana auto-loads it on startup when mounted at:
#   /etc/grafana/provisioning/datasources/

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    uid: prometheus
    jsonData:
      timeInterval: "15s"          # Must match Prometheus scrape_interval
      queryTimeout: "30s"
      httpMethod: "POST"
    version: 1
