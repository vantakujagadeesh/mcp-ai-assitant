# Prometheus Configuration — MCP AI Assistant Monitoring
# =======================================================
# Scrape config for the MCP AI Assistant API server and Redis.
#
# Usage:
#   docker compose up                # starts Prometheus automatically
#   prometheus --config.file=monitoring/prometheus/prometheus.yml  # standalone

global:
  scrape_interval: 15s       # How often to scrape targets by default
  evaluation_interval: 15s   # How often to evaluate rules
  scrape_timeout: 10s        # Timeout for each scrape request

  # External labels (useful when federating or shipping to remote systems)
  external_labels:
    monitor: "mcp-assistant"
    environment: "production"

# Alerting configuration (optional — extend with Alertmanager)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # Add Alertmanager targets here:
          # - targets: ["alertmanager:9093"]

# Rule files (optional — add .yml files for recording/alerting rules)
rule_files:
  # - "alerts.yml"

# Scrape targets
scrape_configs:

  # ---- Main API Server ----
  - job_name: "mcp-assistant-api"
    metrics_path: "/metrics"
    scheme: http
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "mcp-api"
          component: "rest-api"

  # ---- Redis ----
  - job_name: "mcp-assistant-redis"
    static_configs:
      - targets: ["redis:6379"]
        labels:
          service: "mcp-redis"
          component: "cache"
    # Redis exporter is available at a separate port.
    # Uncomment if you run a redis_exporter sidecar:
    # metrics_path: "/metrics"
    # relabel_configs:
    #   - source_labels: [__address__]
    #     target_label: __param_target
    #   - source_labels: [__param_target]
    #     target_label: instance
    #   - target_label: __address__
    #     replacement: redis-exporter:9121

  # ---- Node Exporter (host metrics) ----
  # Uncomment to collect CPU/memory/disk from the host:
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]

  # ---- Prometheus itself ----
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "monitoring"
          component: "prometheus"
