# MCP AI Assistant — Server Configuration
# ========================================

transport: "rest"            # "rest" (FastAPI) or "sse" (MCP-native, stub)
host: "0.0.0.0"
port: 8000

model:
  name: "unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit"
  max_seq_length: 2048
  load_in_4bit: true
  # Path to fine-tuned LoRA adapters.
  # - Local path: "./results/models/finetuned-lora"
  # - Hugging Face Hub: "your-username/llama-support-lora"
  # Leave commented out or set to null to use the base model without adapters.
  lora_path: null

rag:
  # kb_path: null   → defaults to data/knowledge_base/support_articles.jsonl
  embedding_model: "all-MiniLM-L6-v2"
  top_k: 5
